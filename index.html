<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas | 2 Costa Rica Real Estate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* 2CRRE brand colors */
  :root {
    --green: #7ab942;
    --teal: #0d505a;
    --teal-2: #1e4d58;
    --sage: #6f9096;
    --grey: #838383;
    --white: #ffffff;
    --black: #000000;
    --serif: "EB Garamond", Garamond, Georgia, serif;
    --sans: "Poppins", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    height: 100vh; height: 100dvh;
    overflow: hidden;                      /* everything fits on one screen */
    background: radial-gradient(120% 100% at 75% 0%, var(--teal), var(--teal-2) 70%);
    color: var(--white);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column;
    padding: max(20px, env(safe-area-inset-top)) clamp(20px, 5vw, 64px) max(20px, env(safe-area-inset-bottom));
    position: relative;
  }
  #terrain { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  body::after { /* darken behind the tiles so they read clearly */
    content: ""; position: fixed; left: 0; right: 0; bottom: 0; height: 45%;
    background: linear-gradient(to bottom, transparent, rgba(13,40,46,.75));
    z-index: 0; pointer-events: none;
  }
  .topbar, .hero { position: relative; z-index: 1; width: 100%; max-width: 1100px; margin-left: auto; margin-right: auto; }

  .topbar { display: flex; justify-content: space-between; align-items: center; }
  .logo { height: clamp(56px, 10vh, 96px); width: auto; display: block; }
  #today { font-size: 14px; color: #cfe0e2; }

  .hero {
    flex: 1; min-height: 0;
    display: flex; align-items: center; justify-content: space-between;
    gap: clamp(24px, 5vw, 72px);
    padding: 16px 0 28px;
  }
  .hero-text { min-width: 0; }

  /* ---------- Tip of the Day ---------- */
  .tip {
    flex: 0 1 clamp(320px, 36vw, 460px);
    align-self: center;
    height: min(100%, 400px);
    perspective: 1600px;
    position: relative; z-index: 2;
  }
  .flipper {
    position: relative; width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform .9s cubic-bezier(.2,.75,.2,1);
  }
  .face {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: clamp(18px, 2.6vh, 26px) clamp(20px, 2vw, 28px);
    border-radius: 20px;
    background:
      linear-gradient(160deg, rgba(122,185,66,.10), transparent 40%),
      rgba(12, 44, 51, .86);
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 30px 60px -28px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
  }
  .face.back { transform: rotateY(180deg); }

  .tip-head, .tip-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex: none; }
  .tip-label {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 12.5px; font-weight: 600; color: var(--green); letter-spacing: .02em;
  }
  .tip-num { font-size: 12px; color: var(--sage); }

  .tip-body { position: relative; flex: 1; min-height: 0; margin: 14px 0 12px; }
  .tip-body::before { /* large quotation mark */
    content: "\201C"; position: absolute; left: -4px; top: -18px;
    font-family: var(--serif); font-size: 72px; line-height: 1; color: rgba(122,185,66,.35);
    pointer-events: none;
  }
  .tip-text {
    height: 100%; overflow: hidden;
    padding-top: 22px;
    font-family: var(--serif); font-size: 22px; line-height: 1.38;
    color: #f2f6f4; white-space: pre-line;
  }
  .face.short .tip-text { display: flex; flex-direction: column; justify-content: center; padding-top: 0; }
  .face.long .tip-text {
    -webkit-mask-image: linear-gradient(to bottom, #000 72%, transparent);
            mask-image: linear-gradient(to bottom, #000 72%, transparent);
  }
  .tip-source { font-size: 13px; color: #a9c0c3; font-style: italic; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tip-actions { display: flex; align-items: center; gap: 8px; flex: none; }
  .read-btn {
    display: none; border: 0; background: none; color: var(--green); cursor: pointer;
    font: 600 13px var(--sans); padding: 8px 4px;
  }
  .face.long .read-btn { display: inline-block; }
  .read-btn:hover { text-decoration: underline; }
  .next-btn {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06);
    color: var(--white); font: 500 13px var(--sans);
    padding: 8px 12px 8px 14px; border-radius: 99px;
    transition: background .2s ease, border-color .2s ease;
  }
  .next-btn svg { width: 14px; height: 14px; transition: transform .5s ease; }
  .next-btn:hover { background: var(--green); border-color: var(--green); }
  .next-btn:hover svg { transform: rotate(-180deg); }
  .next-btn:focus-visible, .read-btn:focus-visible, .icon-btn:focus-visible, .tip-pill:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  /* Full-tip reader for the long ones */
  .reader {
    position: fixed; inset: 0; z-index: 20;
    display: grid; place-items: center; padding: 24px;
    background: rgba(6, 26, 30, .62);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    animation: fadeIn .25s ease;
  }
  .reader[hidden] { display: none; }
  .reader-panel {
    width: min(720px, 100%); max-height: min(88vh, 780px);
    display: flex; flex-direction: column;
    padding: 26px 30px; border-radius: 22px;
    background: linear-gradient(160deg, rgba(122,185,66,.10), transparent 40%), #0f3a42;
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: 0 40px 80px -30px rgba(0,0,0,.8);
    animation: rise .35s cubic-bezier(.2,.75,.2,1);
  }
  .reader-text {
    flex: 1; min-height: 0; overflow-y: auto; margin: 18px 0 20px; padding-right: 6px;
    font-family: var(--serif); font-size: clamp(16px, 2.1vh, 19px); line-height: 1.5;
    color: #f2f6f4; white-space: pre-line;
    scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent;
  }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(255,255,255,.08); color: var(--white); display: grid; place-items: center;
  }
  .icon-btn:hover { background: rgba(255,255,255,.16); }
  .icon-btn svg { width: 14px; height: 14px; }
  @keyframes fadeIn { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } }

  .tip-pill {
    display: none; margin-top: 16px; cursor: pointer;
    border: 1px solid rgba(122,185,66,.5); background: rgba(122,185,66,.12);
    color: var(--white); font: 500 13px var(--sans); padding: 8px 14px; border-radius: 99px;
  }
  .greeting { margin: 0 0 4px; color: var(--green); font-weight: 500; font-size: clamp(15px, 2.2vh, 19px); }
  h1 {
    margin: 0;
    font-family: var(--serif); font-weight: 400;
    font-size: min(16vw, 22vh);
    line-height: .9; letter-spacing: .01em;
  }
  /* Title entrance, same as Tech Training: rise in */
  .hero-enter { opacity: 0; transform: translateY(8px); animation: heroEnter .5s ease-out forwards; }
  .greeting.hero-enter { animation-delay: 0s; }
  .sub.hero-enter { animation-delay: .3s; }
  @keyframes heroEnter { to { opacity: 1; transform: translateY(0); } }
  /* Blur Text: each letter comes into focus in turn */
  #atlasTitle span { display: inline-block; opacity: 0; filter: blur(14px); transform: translateY(-.08em);
    animation: letterFocus .9s ease-out forwards; }
  #atlasTitle span:nth-child(1) { animation-delay: .10s; }
  #atlasTitle span:nth-child(2) { animation-delay: .22s; }
  #atlasTitle span:nth-child(3) { animation-delay: .34s; }
  #atlasTitle span:nth-child(4) { animation-delay: .46s; }
  #atlasTitle span:nth-child(5) { animation-delay: .58s; }
  @keyframes letterFocus { to { opacity: 1; filter: blur(0); transform: none; } }
  /* Rotating greeting, English and Spanish */
  .greeting { height: 1.4em; overflow: hidden; perspective: 300px; }
  .greet-line { display: block; transition: transform .7s cubic-bezier(.2,.75,.2,1), opacity .7s ease; transform-origin: 50% 50%; }
  .greet-line.out { transform: translateY(-100%) rotateX(60deg); opacity: 0; }
  .greet-line.in { transition: none; transform: translateY(100%) rotateX(-60deg); opacity: 0; }
  @media (prefers-reduced-motion: reduce) {
    .hero-enter, #atlasTitle span { animation: none; opacity: 1; filter: none; transform: none; } .greet-line { transition: none; }
  }
  .sub { margin: 14px 0 0; font-size: clamp(15px, 2.2vh, 20px); color: #d5e3e4; }

  /* ---------- Tiles ---------- */
  /* ---------- Slim tiles that expand on hover ---------- */
  .dock { position: relative; z-index: 1; width: 100%; max-width: 1100px; margin: 0 auto; }
  .apps {
    display: flex; gap: clamp(10px, 1.2vw, 14px);
    height: clamp(210px, 34vh, 320px);
    overflow: hidden;
  }
  .apps::-webkit-scrollbar { display: none; }
  .tile {
    position: relative;
    flex: 1 1 0; min-width: 0;
    display: flex; flex-direction: column;
    background: var(--white); color: var(--black);
    border-radius: 16px; overflow: hidden;
    text-decoration: none; outline: none;
    box-shadow: 0 24px 48px -20px rgba(0,0,0,.55);
    transition: flex-grow .5s cubic-bezier(.22,.8,.25,1);
  }
  .tile.open { flex-grow: 3.6; }
  .body { container-type: inline-size; }

  a.tile:focus-visible { box-shadow: 0 0 0 3px var(--green); }

  .art { flex: 1; min-height: 0; }
  .art svg { width: 100%; height: 100%; display: block; }

  .body {
    position: relative;
    height: clamp(92px, 13vh, 124px);
    padding: 14px 18px;
    overflow: hidden;
  }
  .kind { display: block; font-size: 11px; font-weight: 500; color: var(--green); margin-bottom: 2px; letter-spacing: .02em; }
  .body h2 {
    margin: 0; font-family: var(--serif); font-weight: 500;
    font-size: clamp(18px, 2.5vh, 24px); line-height: 1.15; color: var(--teal);
  }
  .body p {
    margin: 6px 0 0; width: 250px; max-width: calc(100% - 56px);
    color: var(--grey); font-size: 13.5px; line-height: 1.45;
    opacity: 0; transition: opacity .2s ease;
  }
  .go, .badge {
    position: absolute; right: 16px; bottom: 16px;
    opacity: 0; transform: translateX(-8px);
    transition: opacity .2s ease, transform .3s ease;
  }
  .tile.open .body p, .tile.open .go, .tile.open .badge { opacity: 1; transform: none; transition-delay: .18s; }
  .go {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--green); display: grid; place-items: center;
  }
  .go svg { width: 16px; height: 16px; }
  .badge { font-size: 12px; font-weight: 500; color: var(--grey); border: 1px solid #d9d9d9; padding: 5px 10px; border-radius: 99px; white-space: nowrap; }

  /* Group tile (e.g. all forms in one tile) */
  .art { position: relative; }
  .links {
    position: absolute; inset: 0; margin: 0; padding: 14px; list-style: none;
    display: flex; flex-direction: column; justify-content: center; gap: 6px;
    background: rgba(13,80,90,.94);
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .tile.open .links { opacity: 1; pointer-events: auto; transition-delay: .15s; }
  .links a {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    color: var(--white); text-decoration: none; font-size: 14.5px; font-weight: 500;
    padding: 9px 12px; border-radius: 10px; background: rgba(255,255,255,.08);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .links a:hover, .links a:focus-visible { background: var(--green); outline: none; }
  .links a svg { width: 14px; height: 14px; flex: none; }
  .group .body p { width: 240px; }

  /* Very slim tiles (only when many apps): tighter text */
  .tile:not(.open) .body { padding-left: clamp(10px, 1.4vw, 18px); padding-right: clamp(8px, 1vw, 18px); }
  @container (max-width: 110px) {
    .body h2 { font-size: 15px; }
    .kind { font-size: 10px; }
  }


  /* ---------- Card illustrations come alive on hover ---------- */
  .art svg * { transform-box: fill-box; }
  /* Market Stats: gridlines rise, bars regrow, trend line redraws */
  .a-vgrid path { transform-origin: 50% 100%; transform: scaleY(0); transition: transform .5s ease; }
  .a-bars rect { transform-origin: 50% 100%; }
  .a-line { stroke-dasharray: 1 2; stroke-dashoffset: 0; }
  .a-dot { transform-origin: center; }
  /* Marketing: extra wave hidden at rest */
  .a-w3 { opacity: 0; }
  .a-horn { transform-origin: 30% 50%; }
  /* IT: gear */
  .a-gear { transform-origin: center; }
  /* SOPs: third check hidden at rest */
  .a-c1, .a-c2, .a-c3 { stroke-dasharray: 1 2; }
  .a-c3 { stroke-dashoffset: 1.1; }
  /* Training */
  .a-prog { transform-origin: 0 50%; transform: scaleX(.575); }
  .a-play { transform-origin: center; }
  /* Exclusive */
  .a-star { transform-origin: center; }
  .a-roof { stroke-dasharray: 1 2; }

  .tile:is(:hover, .open, :focus-visible) .a-vgrid path { transform: scaleY(1); }
  .tile:is(:hover, .open, :focus-visible) .a-vgrid path:nth-child(2) { transition-delay: .05s; }
  .tile:is(:hover, .open, :focus-visible) .a-vgrid path:nth-child(3) { transition-delay: .1s; }
  .tile:is(:hover, .open, :focus-visible) .a-vgrid path:nth-child(4) { transition-delay: .15s; }
  .tile:is(:hover, .open, :focus-visible) .a-vgrid path:nth-child(5) { transition-delay: .2s; }
  .tile:is(:hover, .open, :focus-visible) .a-vgrid path:nth-child(6) { transition-delay: .25s; }
  .tile:is(:hover, .open, :focus-visible) .a-bars rect { animation: barGrow .7s cubic-bezier(.3,1.3,.5,1) both; }
  .tile:is(:hover, .open, :focus-visible) .a-bars rect:nth-child(2) { animation-delay: .07s; }
  .tile:is(:hover, .open, :focus-visible) .a-bars rect:nth-child(3) { animation-delay: .14s; }
  .tile:is(:hover, .open, :focus-visible) .a-bars rect:nth-child(4) { animation-delay: .21s; }
  .tile:is(:hover, .open, :focus-visible) .a-bars rect:nth-child(5) { animation-delay: .28s; }
  .tile:is(:hover, .open, :focus-visible) .a-bars rect:nth-child(6) { animation-delay: .35s; }
  .tile:is(:hover, .open, :focus-visible) .a-line { animation: lineDraw 1s ease-out .15s both; }
  .tile:is(:hover, .open, :focus-visible) .a-dot { animation: dotPop .4s cubic-bezier(.3,1.6,.5,1) 1.05s both; }
  @keyframes barGrow { from { transform: scaleY(.15); } to { transform: scaleY(1); } }
  @keyframes lineDraw { from { stroke-dashoffset: 1.1; } to { stroke-dashoffset: 0; } }
  @keyframes dotPop { from { transform: scale(0); } to { transform: scale(1); } }

  .tile:is(:hover, .open, :focus-visible) .a-horn { animation: horn 1.2s ease-in-out infinite; }
  .tile:is(:hover, .open, :focus-visible) .a-w1 { animation: wave 1.2s ease-out infinite; }
  .tile:is(:hover, .open, :focus-visible) .a-w2 { animation: wave 1.2s ease-out .2s infinite; }
  .tile:is(:hover, .open, :focus-visible) .a-w3 { animation: wave 1.2s ease-out .4s infinite; }
  @keyframes horn { 0%, 100% { transform: rotate(0); } 15% { transform: rotate(-4deg); } 30% { transform: rotate(0); } }
  @keyframes wave { 0% { opacity: 0; transform: translateX(-6px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateX(8px); } }

  .tile:is(:hover, .open, :focus-visible) .a-gear { animation: spin 3s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .tile:is(:hover, .open, :focus-visible) .a-c1 { animation: tick1 3.2s ease-in-out infinite; }
  .tile:is(:hover, .open, :focus-visible) .a-c2 { animation: tick2 3.2s ease-in-out infinite; }
  .tile:is(:hover, .open, :focus-visible) .a-c3 { animation: tick3 3.2s ease-in-out infinite; }
  .tile:is(:hover, .open, :focus-visible) .a-b3 { animation: box3 3.2s ease-in-out infinite; }
  .tile:is(:hover, .open, :focus-visible) .a-l3 { animation: line3 3.2s ease-in-out infinite; }
  @keyframes tick3 { 0%, 8% { stroke-dashoffset: 1.1; } 20%, 60% { stroke-dashoffset: 0; } 72%, 100% { stroke-dashoffset: 1.1; } }
  @keyframes box3 { 0%, 8% { stroke: #838383; } 20%, 60% { stroke: #7ab942; } 72%, 100% { stroke: #838383; } }
  @keyframes line3 { 0%, 8% { fill: #d9d9d9; } 20%, 60% { fill: #6f9096; } 72%, 100% { fill: #d9d9d9; } }
  @keyframes tick1 { 0%, 30% { stroke-dashoffset: 0; } 40%, 50% { stroke-dashoffset: 1.1; } 62%, 100% { stroke-dashoffset: 0; } }
  @keyframes tick2 { 0%, 45% { stroke-dashoffset: 0; } 55%, 70% { stroke-dashoffset: 1.1; } 82%, 100% { stroke-dashoffset: 0; } }

  .tile:is(:hover, .open, :focus-visible) .a-prog { animation: prog 2.4s ease-in-out infinite; }
  .tile:is(:hover, .open, :focus-visible) .a-play { animation: pulse 1.2s ease-in-out infinite; }
  .tile:is(:hover, .open, :focus-visible) .a-p1 { transform: translate(4px, -3px); }
  .tile:is(:hover, .open, :focus-visible) .a-p2 { transform: translate(8px, -6px); }
  .a-p1, .a-p2 { transition: transform .4s ease; }
  @keyframes prog { 0% { transform: scaleX(.575); } 70% { transform: scaleX(1); } 100% { transform: scaleX(1); } }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }

  .tile:is(:hover, .open, :focus-visible) .a-star { animation: starSpin .9s cubic-bezier(.3,1.4,.5,1) both, bob 2s ease-in-out .9s infinite; }
  .tile:is(:hover, .open, :focus-visible) .a-roof { animation: lineDraw .8s ease-out both; }
  @keyframes starSpin { from { transform: rotate(-200deg) scale(.4); } to { transform: rotate(0) scale(1); } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

  .a-f1, .a-f2 { transition: transform .45s cubic-bezier(.3,1.3,.5,1); transform-origin: 0 100%; }
  .tile:is(:hover, .open, :focus-visible) .a-f1 { transform: rotate(6deg) translateX(6px); }
  .tile:is(:hover, .open, :focus-visible) .a-f2 { transform: rotate(12deg) translateX(12px); }

  @media (prefers-reduced-motion: reduce) {
    .art svg * { animation: none !important; transition: none !important; }
  }

  @media (max-height: 720px) { .body p { display: none; } }

  /* Phones and touch screens: normal-width cards you swipe through */
  @media (max-width: 700px), (hover: none) {
    .tile { flex: 0 0 min(72vw, 300px); }
    .tile .body p, .tile .go, .tile .badge, .tile .links { opacity: 1; transform: none; pointer-events: auto; }
  }
  @media (max-width: 900px) {
    .tip { display: none; }
    .tip-pill { display: inline-block; }
  }
  @media (max-width: 700px) {
    #today { display: none; }
    .apps { height: clamp(180px, 30vh, 240px); }
    .body p { display: none; }
    h1 { font-size: min(26vw, 14vh); }
  }
  @media (prefers-reduced-motion: reduce) { .tile, .body p, .go, .badge, .flipper, .next-btn svg { transition: none; } .reader, .reader-panel { animation: none; } }
</style>
</head>
<body>

const ART_BG = { forms: "#1e4d58", chart: "#0d505a", training: "#6f9096", exclusive: "#1e4d58", marketing: "#7ab942", it: "#e9eeef", checklist: "#e9eeef" };
const arrow = `<svg viewBox="0 0 16 16" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>`;

const appsEl = document.getElementById("apps");
const MIN_TILE = 110;                       // narrowest a tile may get before grouping
const isTouch = () => matchMedia("(max-width: 700px), (hover: none)").matches;

function makeTile(app) {
  const live = !!app.url;
  const tile = document.createElement(live ? "a" : "div");
  tile.className = "tile";
  if (live) { tile.href = app.url; if (app.newTab) { tile.target = "_blank"; tile.rel = "noopener"; } }
  tile.innerHTML = `
    <div class="art" style="background:${ART_BG[app.art] || '#e9eeef'}">${ART[app.art] || ""}</div>
    <div class="body">
      <div><span class="kind"></span><h2></h2><p></p></div>
      ${live ? `<span class="go" aria-hidden="true">${arrow}</span>` : `<span class="badge">Coming soon</span>`}
    </div>`;
  tile.querySelector(".kind").textContent = app.kind || "";
  tile.querySelector("h2").textContent = app.name;
  tile.querySelector("p").textContent = app.description || "";
  return tile;
}

function makeGroupTile(name, items) {
  const g = GROUPS[name] || {};
  const tile = document.createElement("div");
  tile.className = "tile group";
  tile.tabIndex = 0;
  tile.innerHTML = `
    <div class="art" style="background:${ART_BG[g.art] || '#1e4d58'}">${ART[g.art] || ""}<ul class="links"></ul></div>
    <div class="body"><div><span class="kind"></span><h2></h2><p></p></div></div>`;
  tile.querySelector(".kind").textContent = `${items.length} ${g.kind || "items"}`;
  tile.querySelector("h2").textContent = name;
  tile.querySelector("p").textContent = g.description || "";
  const ul = tile.querySelector(".links");
  items.forEach(app => {
    const li = document.createElement("li"), a = document.createElement("a");
    a.textContent = app.name;
    a.insertAdjacentHTML("beforeend", arrow);
    if (app.url) { a.href = app.url; if (app.newTab) { a.target = "_blank"; a.rel = "noopener"; } }
    li.appendChild(a); ul.appendChild(li);
  });
  return tile;
}

let mode = null;
function render() {
  const gap = parseFloat(getComputedStyle(appsEl).columnGap) || 12;
  const fits = Math.floor((appsEl.clientWidth + gap) / (MIN_TILE + gap));
  const grouped = !isTouch() && APPS.length > fits;
  if (grouped === mode) return;
  mode = grouped;
  appsEl.innerHTML = "";
  const done = new Set();
  APPS.forEach(app => {
    if (grouped && app.group) {
      if (done.has(app.group)) return;
      done.add(app.group);
      appsEl.appendChild(makeGroupTile(app.group, APPS.filter(x => x.group === app.group)));
    } else {
      appsEl.appendChild(makeTile(app));
    }
  });
}
render();
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(render, 120); });

/* The tile under the mouse (or keyboard focus) expands */
(() => {
  const canHover = matchMedia("(hover: hover) and (min-width: 701px)");
  const open = t => [...appsEl.children].forEach(x => x.classList.toggle("open", x === t));
  const tileOf = el => el && el.closest && el.closest(".tile");
  appsEl.addEventListener("mouseover", e => { const t = tileOf(e.target); if (t && canHover.matches) open(t); });
  appsEl.addEventListener("focusin", e => { const t = tileOf(e.target); if (t && canHover.matches) open(t); });
  appsEl.addEventListener("mouseleave", () => open(null));
  appsEl.addEventListener("focusout", e => { if (!appsEl.contains(e.relatedTarget)) open(null); });
})();

"text": "Why emotional intelligence matters more than ever. As information becomes increasingly accessible through AI and online platforms, the differentiator is shifting from “who has the information” to “who can guide people emotionally through complex decisions.” Properties can be found online. Contracts can be automated. Data can be analyzed instantly. But clients still need trust, perspective, reassurance, negotiation guidance and emotional clarity.\n\nThe most overlooked part of emotional intelligence is managing yourself. Agents who lack self-awareness often talk too much, become defensive, push too hard, attach emotionally to outcomes, and let rejection affect their confidence. Emotionally intelligent professionals understand their own triggers, maintain composure, avoid desperation energy, and focus on long-term relationships over short-term wins. Clients are highly sensitive to emotional energy. Calm confidence builds credibility."
},
{
"text": "When the market is tough, start with the low-hanging fruit, not because it’s easy, but because momentum is fuel. Then use that fuel to climb to the top of the tree where no one else is willing to climb, and shake all the fruit into your basket. Find the most probable buyer or seller you have and focus there. Get yourself a win, boost your confidence (and yes, your bank account), then use that energy to climb past the low-hanging fruit, which is always crowded with competitors, and make the tough sale. Educate the “impossible” seller. Corral the challenging buyer."

},

},

"text": "Information without application is just entertainment. A NAR study found that 87% of new real estate agents fail within five years. The agents who survive, and thrive, are not the ones who were handed better leads or a better market. They are the ones who took what they learned and built habits around it. Day after day. Quietly. Consistently.\n\nAccording to research published in the European Journal of Social Psychology by Dr. Phillippa Lally of University College London, it takes an average of 66 days of consistent repetition to form a habit. Sixty-six days of doing the uncomfortable thing until it becomes instinct. So what are you doing with these tips? Pick one. Just one. Write it down. Set a calendar reminder every morning for the next 66 days to do that one thing. Because one habit built all the way is worth a thousand ideas that never left your phone screen. Now go."

"text": "Know the numbers your clients would never know. Buyers and sellers can access data. They cannot access experience. Before you walk into any conversation today, ask yourself: do I know the current median days on market for the communities I serve? Agents who quote specific local market metrics in the first three minutes of a client conversation are twice as likely to retain that client through closing. Not “the market is active.” Specific numbers: median price per square meter, inventory levels, price reductions this quarter. Your client has Google. Your client has ChatGPT. What they don’t have is you interpreting those numbers for their specific situation. Pull one concrete market stat today and work it into every conversation you have this week."
},

},

"text": "What is your niche? The agents who struggle most are the ones trying to be everything to everyone. Research by Inman News consistently shows that agents with a defined geographic or property-type specialty close 40% more transactions per year than generalists, because buyers and sellers seek out the perceived expert, not the available agent. In a market like Costa Rica, where communities vary dramatically in lifestyle, price point and buyer profile, there is enormous power in owning a lane. What is yours? Buyer’s agent? Seller’s agent? Luxury homes? Land? Condos? Which clients do you bond with best: Costa Ricans, or foreigners who are part of the global migration? Find your lane, speak to those clients, and be the authority."
},
{
"text": "Compete against yourself. When you look outside (your rivals, your industry, your luck), there is always something to blame. When you look inside (your process, your effort, your rate of learning), there is always something to improve. Average looks out. Elite looks in.",
"source": "James Clear"
},

},
{
"text": "The fortune is in the follow-up, but only if the follow-up is actually useful. Most follow-up sounds the same: “Just checking in.” “Any updates?” “Are you still interested?” That does not create momentum. If you want to turn interest into income, your follow-up has to add value and create a next step. Send the new comp. Explain a market shift. Share a property that matches what they said mattered. Remind them of the goal they told you. Ask a question that moves the decision forward.\n\nGood follow-up makes the consumer feel like you were listening. Great follow-up makes the consumer feel like you are leading. A lot of opportunities don’t disappear because the client wasn’t serious. They disappear because the agent didn’t create a reason to continue the conversation. Look at your pipeline today. Who needs value, clarity or a clear next step?",
"source": "A top real estate coach"
},
{
"text": "If every agent in your market is saying the same thing, the consumer has no reason to choose you. That is why positioning matters. You should be able to finish this sentence: “I am the agent clients choose when they want ___.” Market leadership is not about serving everyone the same way. It is about becoming unmistakable to the people you are best equipped to help. Maybe it’s premium listing strategy. Maybe you are a buyer’s agent. Maybe it is negotiation, or one community rather than the broad market. Whatever it is, own it, and build your content, proof and client experience around it. A strong position makes you easier to remember. A clear message makes you easier to trust. A consistent presence makes you easier to choose. The goal is not to be one of many. The goal is to become the answer.",
"source": "Tom Ferry"
},
{
"text": "A top agent translates the market in a way that others repeat. People start to say: “She’s the neighborhood expert.” “He really markets homes.” “She knows how to negotiate.” “He’s the one I see everywhere.” “She explains things in a way that makes sense.” That is not luck. It is the result of consistent messaging and proof. Decide what you want the market to say, then post about it consistently. Known for marketing? Show the marketing. Negotiation? Explain the strategy. Local expertise? Teach the market weekly. Service? Share the experience behind the result. Reputation is not created by one post or one closing. It is created by repetition. The clearer your message, the easier you are to remember, and the easier you are to remember, the easier you are to refer."
},
{
"text": "What makes a great real estate agent? It’s not the transaction. It’s how clients perceive the value you bring to it, and how they are treated. The goal is simple: provide clarity, eliminate stress, communicate proactively, and make sure every client feels informed and confident throughout the entire process. Solve problems with grace, calm and intelligence every step of the way. The best compliment is not the sale, nor the commission. It is the referral that client sends you, because they would never have their friends and family work with anyone else."
},

"text": "One of the biggest conversion mistakes is leaving the next step optional. A client asks a question. The agent gives an answer. Then the conversation ends with “Let me know.” That is not leadership. If someone is showing interest, your job is to create momentum. Not pressure. Momentum. Try instead: “Based on what you shared, the next best step is for us to look at your options together. I can walk you through what the numbers look like and what is realistic in today’s market.” That is a stronger close because it serves the client. If you believe the conversation will help them make a better decision, asking for the appointment is not pushy. It is professional. The consumer does not always know the right next step. That is why they need an agent who can lead them to it."

(() => {
  const tipEl = document.getElementById("tip");
  const flipper = document.getElementById("flipper");
  const faces = [...flipper.children];
  const reader = document.getElementById("reader");
  const readerText = document.getElementById("readerText");
  const readerSource = document.getElementById("readerSource");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const KEY = "atlas-tips-seen";

  // Random order without repeats until every tip has been shown
  let seen = [];
  try { seen = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
  function pick() {
    if (seen.length >= TIPS.length) seen = [];
    const pool = TIPS.map((_, i) => i).filter(i => !seen.includes(i));
    const i = pool[Math.floor(Math.random() * pool.length)];
    seen.push(i);
    try { localStorage.setItem(KEY, JSON.stringify(seen)); } catch (e) {}
    return i;
  }

  const refresh = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5V5h-2.5"/></svg>`;
  function fill(face, i) {
    const tip = TIPS[i];
    face.innerHTML = `
      <div class="tip-head"><span class="tip-label">Tip of the Day</span><span class="tip-num"></span></div>
      <div class="tip-body"><div class="tip-text"><span></span></div></div>
      <div class="tip-foot">
        <span class="tip-source"></span>
        <span class="tip-actions">
          <button class="read-btn" type="button">Read full tip</button>
          <button class="next-btn" type="button">Next tip ${refresh}</button>
        </span>
      </div>`;
    face.querySelector(".tip-num").textContent = `No. ${i + 1}`;
    face.querySelector(".tip-text span").textContent = tip.text;
    face.querySelector(".tip-source").textContent = tip.source ? `— ${tip.source}` : "Todd & Scott";
    face.querySelector(".next-btn").onclick = next;
    face.querySelector(".read-btn").onclick = () => openReader(i);
    face.dataset.index = i;
    fit(face);
  }

  // Shrink the text until it fits; very long tips get a "Read full tip" button
  function fit(face) {
    const el = face.querySelector(".tip-text");
    const max = Math.min(30, Math.max(20, tipEl.clientWidth / 15)), min = 19;
    face.classList.remove("long", "short");
    let size = max;
    el.style.fontSize = size + "px";
    while (el.scrollHeight > el.clientHeight + 1 && size > min) {
      size -= .5; el.style.fontSize = size + "px";
    }
    face.classList.toggle("long", el.scrollHeight > el.clientHeight + 1);
    // Short tips sit in the middle of the card instead of hugging the top
    if (size === max && el.firstElementChild.offsetHeight < el.clientHeight * .8) face.classList.add("short");
  }

  let angle = 0, current = 0;
  function next() {
    const i = pick();
    if (!reader.hidden) showInReader(i);
    const hidden = faces[(current + 1) % 2];
    fill(hidden, i);
    angle += 180;
    flipper.style.transform = `rotateY(${angle}deg)`;
    faces[current].setAttribute("aria-hidden", "true");
    hidden.removeAttribute("aria-hidden");
    current = (current + 1) % 2;
    if (reduce) flipper.style.transition = "none";
  }

  function showInReader(i) {
    readerText.textContent = TIPS[i].text;
    readerText.scrollTop = 0;
    readerSource.textContent = TIPS[i].source ? `— ${TIPS[i].source}` : "Todd & Scott";
    reader.dataset.index = i;
  }
  let lastFocus = null;
  function openReader(i) {
    lastFocus = document.activeElement;
    showInReader(i);
    reader.hidden = false;
    document.getElementById("readerClose").focus();
  }
  function closeReader() { reader.hidden = true; if (lastFocus) lastFocus.focus(); }
  document.getElementById("readerClose").onclick = closeReader;
  document.getElementById("readerNext").onclick = () => {
    if (getComputedStyle(tipEl).display === "none") showInReader(pick()); else next();
  };
  reader.addEventListener("click", e => { if (e.target === reader) closeReader(); });
  addEventListener("keydown", e => { if (e.key === "Escape" && !reader.hidden) closeReader(); });
  document.getElementById("tipPill").onclick = () => openReader(Number(faces[current].dataset.index));

  // Keep the card centered between the date (top) and the app tiles (bottom)
  function place() {
    tipEl.style.transform = "";
    tipEl.style.height = "";
    if (getComputedStyle(tipEl).display === "none") return;
    const top = document.getElementById("today").getBoundingClientRect().bottom;
    const bottom = document.getElementById("apps").getBoundingClientRect().top;
    const room = bottom - top;
    const gap = Math.max(24, Math.min(56, room * .09));
    const h = Math.min(430, room - gap * 2);
    tipEl.style.height = h + "px";
    const r = tipEl.getBoundingClientRect();
    tipEl.style.transform = `translateY(${top + (room - h) / 2 - r.top}px)`;
  }
  place();
  fill(faces[0], pick());
  let ft; addEventListener("resize", () => { clearTimeout(ft); ft = setTimeout(() => { place(); faces.forEach(f => f.dataset.index && fit(f)); }, 150); });
  if (document.fonts) document.fonts.ready.then(() => { place(); faces.forEach(f => f.dataset.index && fit(f)); });
})();

/* Living topographic map: slowly drifting contour lines */
(() => {
  const canvas = document.getElementById("terrain");
  const ctx = canvas.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ---- Perlin noise ----
  const p = new Uint8Array(512);
  const base = [...Array(256).keys()].sort(() => Math.random() - .5);
  for (let i = 0; i < 512; i++) p[i] = base[i & 255];
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  const lerp = (a, b, t) => a + t * (b - a);
  const grad = (h, x, y) => ((h & 1) ? -x : x) + ((h & 2) ? -y : y);
  function noise(x, y) {
    const X = Math.floor(x) & 255, Y = Math.floor(y) & 255;
    x -= Math.floor(x); y -= Math.floor(y);
    const u = fade(x), v = fade(y), a = p[X] + Y, b = p[X + 1] + Y;
    return lerp(lerp(grad(p[a], x, y), grad(p[b], x - 1, y), u),
                lerp(grad(p[a + 1], x, y - 1), grad(p[b + 1], x - 1, y - 1), u), v);
  }
  const terrain = (x, y, t) => noise(x + t, y - t * .6) * .7 + noise(x * 2.1 - t * .5, y * 2.1 + t) * .3;

  // ---- Settings ----
  const LEVEL = 0.09;          // height between two contour lines
  const MAJOR = 4;             // every 4th line is green

  let W, H, cols, rows, step;

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    step = W < 700 ? 9 : 12;
    cols = Math.ceil(W / step) + 1; rows = Math.ceil(H / step) + 1;
  }

  function draw(t) {
    ctx.clearRect(0, 0, W, H);
    const s = 1 / 260, val = new Float32Array(cols * rows);
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      val[j * cols + i] = terrain(i * step * s, j * step * s, t);
    }

    const minor = new Path2D(), major = new Path2D();
    for (let j = 0; j < rows - 1; j++) for (let i = 0; i < cols - 1; i++) {
      const a = val[j*cols+i], b = val[j*cols+i+1], c = val[(j+1)*cols+i+1], d = val[(j+1)*cols+i];
      const lo = Math.min(a, b, c, d), hi = Math.max(a, b, c, d);
      for (let L = Math.ceil(lo / LEVEL); L * LEVEL <= hi; L++) {
        const th = L * LEVEL;
        const idx = (a > th) | ((b > th) << 1) | ((c > th) << 2) | ((d > th) << 3);
        if (idx === 0 || idx === 15) continue;
        const path = (L % MAJOR === 0) ? major : minor;
        const x = i * step, y = j * step;
        const T = [x + step*(th-a)/(b-a), y], R = [x + step, y + step*(th-b)/(c-b)],
              B = [x + step*(th-d)/(c-d), y + step], Lf = [x, y + step*(th-a)/(d-a)];
        const seg = (p1, p2) => { path.moveTo(p1[0], p1[1]); path.lineTo(p2[0], p2[1]); };
        switch (idx) {
          case 1: case 14: seg(Lf, T); break;  case 2: case 13: seg(T, R); break;
          case 3: case 12: seg(Lf, R); break;  case 4: case 11: seg(R, B); break;
          case 6: case 9: seg(T, B); break;    case 7: case 8: seg(Lf, B); break;
          case 5: seg(Lf, T); seg(R, B); break; case 10: seg(T, R); seg(Lf, B); break;
        }
      }
    }
    ctx.lineWidth = 1;   ctx.strokeStyle = "rgba(111,144,150,.42)"; ctx.stroke(minor);
    ctx.lineWidth = 1.3; ctx.strokeStyle = "rgba(122,185,66,.55)";  ctx.stroke(major);
  }

  resize();
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { resize(); if (reduce) draw(0); }, 150); });
  if (reduce) { draw(0); return; }
  let last = 0;
  (function loop(ms) { if (ms - last > 40) { draw(ms / 60000); last = ms; } requestAnimationFrame(loop); })(0);
})();
</script>
